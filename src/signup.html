<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | EVision</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Your CSS -->
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark auth-navbar">
        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                EVision
            </a>

            <div class="ms-auto">
                <a href="index.html" class="btn btn-outline-light">
                    <i class="fa-solid fa-house me-1"></i>
                    Home
                </a>
            </div>

        </div>
    </nav>


    <!-- Signup Section -->
    <section class="auth-section">

        <div class="auth-card">

            <div class="auth-heading">

                <div class="auth-icon">
                    <i class="fa-solid fa-user-plus"></i>
                </div>

                <h1>Create Account</h1>

                <p>
                    Join EVision and start exploring electric vehicles.
                </p>

            </div>


            <form id="signupForm">

                <!-- Username -->
                <div class="mb-3">

                    <label for="signupUsername" class="form-label">
                        Username
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="fa-solid fa-user"></i>
                        </span>

                        <input type="text" class="form-control" id="signupUsername" placeholder="Enter your username"
                            required>

                    </div>

                </div>


                <!-- Email -->
                <div class="mb-3">

                    <label for="signupEmail" class="form-label">
                        Email Address
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="fa-solid fa-envelope"></i>
                        </span>

                        <input type="email" class="form-control" id="signupEmail" placeholder="Enter your email"
                            required>

                    </div>

                </div>


                <!-- Password -->
                <div class="mb-3">

                    <label for="signupPassword" class="form-label">
                        Password
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="fa-solid fa-lock"></i>
                        </span>

                        <input type="password" class="form-control" id="signupPassword"
                            placeholder="Minimum 8 characters" required>

                        <button class="btn password-toggle" type="button" data-target="signupPassword">
                            <i class="fa-solid fa-eye"></i>
                        </button>

                    </div>

                </div>


                <!-- Confirm Password -->
                <div class="mb-3">

                    <label for="confirmPassword" class="form-label">
                        Confirm Password
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="fa-solid fa-lock"></i>
                        </span>

                        <input type="password" class="form-control" id="confirmPassword"
                            placeholder="Enter your password again" required>

                        <button class="btn password-toggle" type="button" data-target="confirmPassword">
                            <i class="fa-solid fa-eye"></i>
                        </button>

                    </div>

                </div>


                <!-- Terms -->
                <div class="form-check mb-3">

                    <input class="form-check-input" type="checkbox" id="agreeTerms" required>

                    <label class="form-check-label" for="agreeTerms">
                        I agree to the Terms and Conditions
                    </label>

                </div>


                <!-- Message -->
                <div id="signupMessage" class="auth-message"></div>


                <!-- Signup button -->
                <button type="submit" class="auth-btn">
                    <i class="fa-solid fa-user-plus me-2"></i>
                    Create Account
                </button>

            </form>


            <div class="auth-switch">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </div>

        </div>

    </section>


    <script src="auth.js"></script>

</body>

</html>
